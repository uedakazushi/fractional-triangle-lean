name: Verify and build Blueprint
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      full_clean:
        description: Rebuild all Lean dependencies with the original acceptance gate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: formal
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Verify formal declarations and source provenance
        run: bash scripts/verify.sh
      - name: Original full-clean acceptance gate (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.full_clean
        run: |
          bash scripts/acceptance.sh
          python3 scripts/verify_all_axioms.py validation/final/axioms.log
      - name: Install Blueprint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev texlive-luatex texlive-latex-extra texlive-lang-japanese latexmk
          python3 -m pip install -r blueprint/requirements.txt
      - name: Build and check HTML and PDF
        run: |
          python3 scripts/blueprint_tables.py --check
          python3 scripts/build_blueprint.py --pdf
          python3 scripts/check_site.py
      - name: Upload reviewable site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-logs
          path: validation/
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Blueprint site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
